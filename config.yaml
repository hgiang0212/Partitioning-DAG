name: YOLO
server:
  cut-layer: b
  clients:
    - 9
    - 3
  model: yolo26n
  batch-size: 32

rabbit:
  address: 192.168.101.234
  username: admin
  password: "123456"
  virtual-host: /

pdd:
  enabled: True
  inter_cloud_bandwidth_MBps: 60.0      # BW giữa các cloud node (1 Gbps LAN)
profile:
  devices_path: src/devices.json
  layer_profile_path: src/layer_profile.json
debug-mode: False
data: video.mp4
log-path: .
compress:
  enable: True
  num_bit: 8

fps:
  grace_s: 10             # keep collecting DONEs this long after the work queues drain
  shutdown_timeout_s: 300 # hard cap so a dead worker can't hang the server